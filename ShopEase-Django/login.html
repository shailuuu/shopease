{% extends 'base.html' %}{% block title %}Sign in | ShopEase{% endblock %}{% block content %}<div class="auth-wrap"><form method="post" class="auth-form">{% csrf_token %}<p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<label>Username or email<input name="username" required autofocus></label><label>Password<span class="password-field"><input id="password" type="password" name="password" required><button type="button" data-toggle-password="#password"><i class="far fa-eye"></i></button></span></label><div class="form-row"><label class="check"><input type="checkbox" name="remember_me"> Remember me</label><a href="mailto:support@shopease.local">Forgot password?</a></div><button class="btn btn-dark w-100">Sign in</button><p class="text-center mt-4">New to ShopEase? <a href="{% url 'register' %}">Create an account</a></p></form></div>{% endblock %}
